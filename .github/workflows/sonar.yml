name: Validação Sonar

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes e relatórios Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validar verificador de relatórios
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Executar testes JVM, cobertura e build
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:createDebugUnitTestCoverageReport :app:prepareSonarLibraries
      - name: Validar relatórios reais
        run: python3 scripts/verify_sonar_reports.py
      - name: Publicar relatórios e binários da análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports
          if-no-files-found: error
          path: |
            app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
            app/build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes
            app/build/sonar/libraries
            app/build/reports/coverage/test/debug
            app/build/test-results/testDebugUnitTest

  sonar:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: tests
    uses: delta-app-ofc/.github/.github/workflows/sonar_scan.yml@52e5d0a44f39cfadd3a71de570f553156dbb64a4
    with:
      project_key: ${{ vars.SONAR_PROJECT_KEY || 'delta-app-ofc_delta-mobile-app' }}
      organization: ${{ vars.SONAR_ORGANIZATION || 'delta-app-ofc' }}
      artifact_name: sonar-reports
      artifact_path: app/build
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
